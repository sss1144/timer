<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>作業記録タイマー</title>
    <meta name="description" content="作業・練習の時間を記録して振り返るタイマー" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1d26" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="作業記録" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // 前回の表示モードとテーマを、画面を描く前に当てる（一瞬だけ標準の色が見えるのを防ぐ）。src/lib/themes.ts の applyAppearance と同じ処理
      try {
        var a = JSON.parse(localStorage.getItem('appearance-v2') || 'null');
        if (a) {
          var root = document.documentElement;
          var dark = a.dataMode === 'dark' || (a.dataMode === null && matchMedia('(prefers-color-scheme: dark)').matches);
          if (a.dataMode) root.setAttribute('data-mode', a.dataMode);
          if (a.style) root.setAttribute('data-style', a.style);
          var vars = dark ? a.dark : a.light;
          for (var k in vars) root.style.setProperty(k, vars[k]);
          if (a.font) root.style.setProperty('--font-body', a.font);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
