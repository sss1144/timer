<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkLog</title>
  <meta name="description" content="作業時間を記録するタイマー（ストップウォッチ / カウントダウン / ポモドーロ）">
  <meta name="theme-color" content="#4f7cff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>WorkLog</span></div>
    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="timer" role="tab">タイマー</button>
      <button class="tab" data-tab="tasks" role="tab">タスク</button>
      <button class="tab" data-tab="stats" role="tab">記録・グラフ</button>
      <button class="tab" data-tab="settings" role="tab">設定</button>
    </nav>
  </header>

  <main>
    <!-- タイマー -->
    <section id="tab-timer" class="panel">
      <div class="card timer-card">
        <div class="segmented" id="modeSwitch">
          <button data-mode="up">ストップウォッチ</button>
          <button data-mode="down">カウントダウン</button>
          <button data-mode="pomo">ポモドーロ</button>
        </div>

        <label class="field">
          <span>タスク</span>
          <select id="taskSelect"></select>
        </label>

        <div class="dial">
          <svg viewBox="0 0 200 200" class="ring" aria-hidden="true">
            <circle class="ring-bg" cx="100" cy="100" r="90"></circle>
            <circle id="ringFg" class="ring-fg" cx="100" cy="100" r="90"></circle>
          </svg>
          <div class="dial-inner">
            <div id="phaseLabel" class="phase"></div>
            <div id="timeDisplay" class="time">00:00</div>
            <div id="taskLabel" class="dial-task"></div>
          </div>
        </div>

        <div id="downOptions" class="mode-options">
          <div class="presets" id="presets"></div>
          <label class="inline">時間 <input type="number" id="downMinutes" min="1" max="600" value="25"> 分</label>
        </div>
        <div id="pomoOptions" class="mode-options">
          <div id="pomoDots" class="pomo-dots"></div>
        </div>

        <div class="controls">
          <button id="btnStart" class="btn primary big">開始</button>
          <button id="btnStop" class="btn">停止して記録</button>
          <button id="btnSkip" class="btn">スキップ</button>
          <button id="btnReset" class="btn ghost">破棄</button>
        </div>
        <p class="hint">Space キーで開始 / 一時停止</p>
      </div>

      <div class="card">
        <h2>今日の記録 <span id="todayTotal" class="muted"></span></h2>
        <div id="todayList" class="bars"></div>
      </div>
    </section>

    <!-- タスク -->
    <section id="tab-tasks" class="panel">
      <div class="card">
        <h2>タスクを追加</h2>
        <form id="taskForm" class="row-form">
          <input id="taskName" placeholder="例: 資料作成 / 筋トレ / 料理" required maxlength="40">
          <select id="taskCat">
            <option value="work">作業</option>
            <option value="daily">日常</option>
          </select>
          <input type="color" id="taskColor" title="色">
          <button class="btn primary" type="submit">追加</button>
        </form>
      </div>
      <div class="card">
        <h2>タスク一覧</h2>
        <div id="taskList"></div>
        <label class="check small"><input type="checkbox" id="showArchived"> アーカイブ済みも表示</label>
      </div>
    </section>

    <!-- 記録・グラフ -->
    <section id="tab-stats" class="panel">
      <div class="card">
        <div class="toolbar">
          <div class="segmented" id="periodSwitch">
            <button data-period="today">今日</button>
            <button data-period="week">7日間</button>
            <button data-period="month">30日間</button>
            <button data-period="all">全期間</button>
          </div>
          <select id="catFilter">
            <option value="all">すべて</option>
            <option value="work">作業のみ</option>
            <option value="daily">日常のみ</option>
          </select>
        </div>
        <div class="stat-grid" id="statCards"></div>
      </div>

      <div class="card">
        <h2>タスク別の合計</h2>
        <div id="taskBars" class="bars"></div>
      </div>

      <div class="card">
        <h2 id="dailyTitle">日別の推移</h2>
        <div id="dailyChart" class="chart"></div>
        <div id="dailyLegend" class="legend"></div>
      </div>

      <div class="card">
        <h2>手動で記録を追加</h2>
        <form id="manualForm" class="row-form wrap">
          <select id="manTask" required></select>
          <input type="date" id="manDate" required>
          <input type="time" id="manTime" required>
          <label class="inline"><input type="number" id="manMin" min="1" max="1440" value="30" required> 分</label>
          <input id="manNote" placeholder="メモ（任意）" maxlength="100">
          <button class="btn primary" type="submit">追加</button>
        </form>
      </div>

      <div class="card">
        <h2>記録一覧</h2>
        <div id="sessionList"></div>
      </div>
    </section>

    <!-- 設定 -->
    <section id="tab-settings" class="panel">
      <div class="card">
        <h2>ポモドーロ</h2>
        <div class="settings-grid">
          <label>作業 <span><input type="number" id="setWork" min="1" max="180"> 分</span></label>
          <label>短い休憩 <span><input type="number" id="setShort" min="1" max="60"> 分</span></label>
          <label>長い休憩 <span><input type="number" id="setLong" min="1" max="120"> 分</span></label>
          <label>長い休憩までの回数 <span><input type="number" id="setInterval" min="1" max="12"> 回</span></label>
        </div>
        <label class="check"><input type="checkbox" id="setAuto"> 次のフェーズ（休憩・作業）を自動で開始する</label>
      </div>

      <div class="card">
        <h2>通知</h2>
        <label class="check"><input type="checkbox" id="setSound"> 終了時に音を鳴らす</label>
        <label class="check"><input type="checkbox" id="setNotify"> デスクトップ通知を表示する</label>
        <div class="controls left">
          <button class="btn" id="btnTestSound" type="button">音をテスト</button>
        </div>
      </div>

      <div class="card">
        <h2>データ</h2>
        <p class="muted">データはこのブラウザ内に保存されます（サーバーには送信されません）。ブラウザのデータを消すと記録も消えるので、ときどき書き出してバックアップしてください。</p>
        <div class="controls left">
          <button class="btn" id="btnExport" type="button">JSONで書き出し</button>
          <button class="btn" id="btnExportCsv" type="button">CSVで書き出し</button>
          <label class="btn">JSONを読み込み<input type="file" id="importFile" accept="application/json,.json" hidden></label>
          <button class="btn danger" id="btnClear" type="button">全データ削除</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
